<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720">
  <defs>
    <radialGradient id="bgRose" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#f9f0ec" />
      <stop offset="52%" stop-color="#ead8d0" />
      <stop offset="100%" stop-color="#c9b1a6" />
    </radialGradient>
    <linearGradient id="podiumTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f1e7e1" />
      <stop offset="50%" stop-color="#faf5f2" />
      <stop offset="100%" stop-color="#dfd0c7" />
    </linearGradient>
    <linearGradient id="podiumSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4c0b4" />
      <stop offset="50%" stop-color="#e5d5cb" />
      <stop offset="100%" stop-color="#b39c8f" />
    </linearGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2b1216" stop-opacity="0.5" />
      <stop offset="65%" stop-color="#2b1216" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#2b1216" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="rubyJar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4c0519" />
      <stop offset="22%" stop-color="#881337" />
      <stop offset="48%" stop-color="#9f1239" />
      <stop offset="78%" stop-color="#4c0519" />
      <stop offset="100%" stop-color="#2e020e" />
    </linearGradient>
    <linearGradient id="goldCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#855b1e" />
      <stop offset="28%" stop-color="#eab308" />
      <stop offset="52%" stop-color="#fef08a" />
      <stop offset="78%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#713f12" />
    </linearGradient>
    <linearGradient id="labelCream" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e7dcd6" />
      <stop offset="25%" stop-color="#fdfaf8" />
      <stop offset="75%" stop-color="#faf4f0" />
      <stop offset="100%" stop-color="#d8c8be" />
    </linearGradient>
    <radialGradient id="mangoButter" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="55%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ca8a04" />
    </radialGradient>
  </defs>

  <rect width="900" height="720" fill="url(#bgRose)" />

  <!-- Hibiscus Botanical Petals Behind Jar -->
  <g transform="translate(235, 255) rotate(-22)" fill="#be123c" opacity="0.88">
    <path d="M80 180 C10 140 -10 55 45 15 C95 -15 155 45 110 180 Z" />
    <path d="M95 175 C65 95 115 10 175 30 C220 55 175 145 95 175 Z" fill="#9f1239" />
  </g>
  <g transform="translate(545, 285) rotate(18)" fill="#065f46" opacity="0.85">
    <path d="M0 160 C40 70 120 20 175 45 C145 120 80 165 0 160 Z" />
  </g>

  <!-- Stone Podium -->
  <ellipse cx="450" cy="605" rx="310" ry="42" fill="url(#shadow)" />
  <path d="M170 520 L170 574 A280 36 0 0 0 730 574 L730 520 Z" fill="url(#podiumSide)" />
  <ellipse cx="450" cy="520" rx="280" ry="36" fill="url(#podiumTop)" />

  <!-- Whipped Mango Seed Butter Swirl (Left Foreground) -->
  <g transform="translate(200, 485)">
    <ellipse cx="62" cy="52" rx="58" ry="15" fill="#451a03" opacity="0.22" />
    <path d="M15 48 C25 18 65 12 95 28 C115 38 118 52 95 56 C55 62 15 56 15 48 Z" fill="url(#mangoButter)" />
  </g>

  <!-- Wide Apothecary Night Balm Jar (50ml) -->
  <g transform="translate(0, 12)">
    <ellipse cx="450" cy="516" rx="168" ry="26" fill="url(#shadow)" />
    <!-- Jar Body -->
    <rect x="295" y="290" width="310" height="218" rx="34" fill="url(#rubyJar)" />
    <rect x="312" y="302" width="16" height="192" rx="8" fill="#ffffff" opacity="0.2" />
    <rect x="576" y="302" width="10" height="192" rx="5" fill="#fda4af" opacity="0.16" />

    <!-- Brushed Gold Lid -->
    <rect x="306" y="238" width="288" height="54" rx="12" fill="url(#goldCap)" />
    <rect x="316" y="244" width="268" height="4" rx="2" fill="#ffffff" opacity="0.55" />

    <!-- Cream Wrap Label -->
    <rect x="300" y="324" width="300" height="154" rx="8" fill="url(#labelCream)" />
    <rect x="312" y="334" width="276" height="134" rx="4" fill="none" stroke="#9f1239" stroke-width="1" stroke-opacity="0.3" />

    <text x="450" y="356" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#881337" letter-spacing="3.5">NATUREGLOW</text>
    <text x="450" y="369" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7.5" font-weight="700" fill="#b45309" letter-spacing="2">CIRCULAR R&amp;D LAB FORMULATION</text>

    <text x="450" y="395" text-anchor="middle" font-family="Georgia, serif" font-size="15.5" font-weight="700" fill="#1c1917">Hibiscus Seed &amp; Mango Butter</text>
    <text x="450" y="415" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#9f1239" letter-spacing="2.2">NIGHT RECOVERY BALM</text>

    <rect x="348" y="425" width="204" height="19" rx="9.5" fill="#fff1f2" stroke="#fecdd3" stroke-width="1" />
    <text x="450" y="438" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.2" font-weight="600" fill="#881337">Upcycled Mango Kernel • Hibiscus AHA</text>

    <text x="450" y="459" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#57534e" letter-spacing="1.2">50 ML / 1.7 FL. OZ.  •  CONCEPT PIPELINE</text>
  </g>
</svg>
